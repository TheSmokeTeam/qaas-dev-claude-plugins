name: validate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.312
      - name: Validate plugin repository
        run: ./scripts/validate-plugin.sh
