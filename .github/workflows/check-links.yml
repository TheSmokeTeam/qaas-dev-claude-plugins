name: check-links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  online:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.312
      - name: Run deterministic checks and live URL checks
        run: ./scripts/validate-plugin.sh --online
