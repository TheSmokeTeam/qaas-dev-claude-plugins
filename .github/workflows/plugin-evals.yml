name: plugin-evals

on:
  workflow_dispatch:
    inputs:
      agent_model:
        description: Full Claude model ID for the agent under test
        required: true
        type: string
      judge_model:
        description: Full Claude model ID for LLM graders
        required: true
        type: string
      runs:
        description: Runs per case and arm
        required: true
        default: "3"
        type: string
      threshold:
        description: Required conformance score for every case
        required: true
        default: "1.0"
        type: string
      run_ablation:
        description: Also measure lift against the no-plugin baseline
        required: true
        default: false
        type: boolean

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require evaluation credentials
        run: test -n "$ANTHROPIC_API_KEY"

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.312

      - name: Validate plugin structure
        run: claude plugin validate .

      - name: Run plugin conformance evals
        run: |
          mkdir -p evals/results
          claude plugin eval . \
            --scaffold \
            --trust-plugin \
            --allow-tools Bash Write Edit \
            --model "${{ inputs.agent_model }}" \
            --judge-model "${{ inputs.judge_model }}" \
            --runs "${{ inputs.runs }}" \
            --ablation none \
            --threshold "${{ inputs.threshold }}" \
            --max-cost-usd 30 \
            --no-publish \
            --json evals/results/conformance.json

      - name: Measure plugin lift
        if: ${{ inputs.run_ablation }}
        run: |
          claude plugin eval . \
            --scaffold \
            --trust-plugin \
            --allow-tools Bash Write Edit \
            --model "${{ inputs.agent_model }}" \
            --judge-model "${{ inputs.judge_model }}" \
            --runs "${{ inputs.runs }}" \
            --ablation with-without \
            --threshold 0 \
            --max-cost-usd 30 \
            --no-publish \
            --json evals/results/ablation.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaas-platform-dev-plugin-evals
          path: evals/results/
